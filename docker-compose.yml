services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
    ports:
      - "8080:80"
    environment:
      SERVER_NAME: :80
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      APP_SECRET: "ChangeMe123"
      DATABASE_URL: "postgresql://app:ChangeMe123@database:5432/app?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      EMBEDDER_URL: "http://embedder:8000"
    depends_on:
      - database
      - redis
    tty: true

  database:
    # pgvector ships the official PostgreSQL image + the `vector` extension pre-installed.
    # Data volume is compatible with the previous postgres:16-alpine.
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: "ChangeMe123"
      POSTGRES_USER: app
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  pwa:
    image: node:lts
    working_dir: /app
    volumes:
      - ./pwa:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host

  embedder:
    build:
      context: ./embedder
    # Not exposed publicly — only the api container needs to reach it.
    # Uncomment the ports stanza for local debugging via curl.
    # ports:
    #   - "8001:8000"
    restart: unless-stopped

  worker:
    # Reuses the api image; runs a long-lived messenger consumer.
    # --time-limit recycles the process every hour to avoid memory creep.
    # Plan 05-02 / OPS-04: CLIP `async` transport, intouché — only worker for
    # ComputeEmbeddingMessage. Sibling workers below handle the
    # transformations* transports.
    image: antigravity-api
    volumes:
      - ./api:/app
    environment:
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      APP_SECRET: "ChangeMe123"
      DATABASE_URL: "postgresql://app:ChangeMe123@database:5432/app?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      EMBEDDER_URL: "http://embedder:8000"
    depends_on:
      - api
      - redis
      - embedder
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=512M -vv
    restart: unless-stopped

  worker-transformations:
    # Plan 05-02 / OPS-04 — live warmup consumer.
    # Consumes WarmupTransformationVariantMessage from the `transformations`
    # transport (Redis Streams). APP_CACHE_DIR is per-worker (T-05-11) to
    # avoid Symfony cache-pool lock contention with the `worker` (async) and
    # `worker-transformations-backfill` siblings sharing the same image.
    image: antigravity-api
    volumes:
      - ./api:/app
    environment:
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      APP_SECRET: "ChangeMe123"
      APP_CACHE_DIR: "/tmp/cache-transformations"
      DATABASE_URL: "postgresql://app:ChangeMe123@database:5432/app?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      EMBEDDER_URL: "http://embedder:8000"
    depends_on:
      - api
      - redis
      - embedder
    command: php bin/console messenger:consume transformations --time-limit=3600 --memory-limit=512M -vv
    restart: unless-stopped

  worker-transformations-backfill:
    # Plan 05-02 / OPS-04 — bulk/purge consumer.
    # Consumes PurgeTransformationVariantsMessage (Phase 1) and future bulk
    # warm jobs from the `transformations_backfill` transport. Distinct
    # APP_CACHE_DIR (T-05-11).
    image: antigravity-api
    volumes:
      - ./api:/app
    environment:
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      APP_SECRET: "ChangeMe123"
      APP_CACHE_DIR: "/tmp/cache-transformations-backfill"
      DATABASE_URL: "postgresql://app:ChangeMe123@database:5432/app?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      EMBEDDER_URL: "http://embedder:8000"
    depends_on:
      - api
      - redis
      - embedder
    command: php bin/console messenger:consume transformations_backfill --time-limit=3600 --memory-limit=512M -vv
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
