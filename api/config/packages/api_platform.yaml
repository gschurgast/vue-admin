api_platform:
    title: You-Pim API
    version: 1.0.0
    enable_swagger_ui: true
    enable_re_doc: true
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    resource_class_directories:
        - '%kernel.project_dir%/src/Entity'
        - '%kernel.project_dir%/src/ApiResource'
