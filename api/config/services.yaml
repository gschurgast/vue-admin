# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.embedder_url: '%env(default:app.embedder_url_default:EMBEDDER_URL)%'
    app.embedder_url_default: 'http://embedder:8000'

    # Phase 03 — Asset Transformations orchestrator (Plan 03-02)
    # NOTE: the env(default:<param>:VAR) processor resolves the FALLBACK
    # from a parameter (not from another env). Each default below must be a
    # plain parameter — `env(name): value` declares an env-var default, NOT a
    # parameter, and would crash with "parameter not found" at runtime.
    transformations_embedder_default_url: 'http://embedder:8000'
    transformations.embedder_base_url: '%env(default:transformations_embedder_default_url:EMBEDDER_BASE_URL)%'
    transformations_default_cap_ms: '8000'
    transformations.hard_cap_ms: '%env(int:default:transformations_default_cap_ms:TRANSFORMATIONS_HARD_CAP_MS)%'
    embedder_default_resize_ms: '2000'
    transformations.embedder_timeout_resize_ms: '%env(int:default:embedder_default_resize_ms:EMBEDDER_TIMEOUT_RESIZE_MS)%'
    embedder_default_crop_ms: '2000'
    transformations.embedder_timeout_crop_ms: '%env(int:default:embedder_default_crop_ms:EMBEDDER_TIMEOUT_CROP_MS)%'
    embedder_default_rotate_ms: '2000'
    transformations.embedder_timeout_rotate_ms: '%env(int:default:embedder_default_rotate_ms:EMBEDDER_TIMEOUT_ROTATE_MS)%'
    embedder_default_fc_ms: '3000'
    transformations.embedder_timeout_format_convert_ms: '%env(int:default:embedder_default_fc_ms:EMBEDDER_TIMEOUT_FORMAT_CONVERT_MS)%'
    embedder_default_ab_ms: '4000'
    transformations.embedder_timeout_add_background_ms: '%env(int:default:embedder_default_ab_ms:EMBEDDER_TIMEOUT_ADD_BACKGROUND_MS)%'
    # Phase 04 (Plan 04-04, D-18) — BiRefNet sync handler.
    # 6000ms = 5s Python hard cap (D-05) + 1s network margin.
    embedder_default_rmbg_ms: '6000'
    transformations.embedder_timeout_remove_background_ms: '%env(int:default:embedder_default_rmbg_ms:EMBEDDER_TIMEOUT_REMOVE_BACKGROUND_MS)%'

    # Phase 03 — Public route feature flag (Plan 03-03, D-12). Default OFF in
    # prod (uses `transformations.public_route.enabled_default`).
    # dev/test override via .env*.
    transformations.public_route.enabled_default: '0'
    transformations.public_route.enabled: '%env(bool:default:transformations.public_route.enabled_default:TRANSFORMATIONS_PUBLIC_ROUTE_ENABLED)%'

    # Redis host/port defaults for symfony/lock RedisStore (Plan 03-03, D-01).
    transformations.redis_host_default: 'redis'
    transformations.redis_port_default: '6379'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Alias PlatformInterface to OpenAI platform
    Symfony\AI\Platform\PlatformInterface: '@ai.platform.openai'

    App\State\UserProcessor:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\EventListener\JwtCreatedListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\Service\ConversationService:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'

    # S3 client used in prod by Flysystem (assets.storage).
    # Only instantiated in prod; dev/test use the local adapter instead.
    assets.s3_client:
        class: Aws\S3\S3Client
        arguments:
            - region: '%env(default::S3_REGION)%'
              version: 'latest'
              endpoint: '%env(default::S3_ENDPOINT)%'
              use_path_style_endpoint: '%env(bool:default::S3_USE_PATH_STYLE)%'
              credentials:
                  key: '%env(default::S3_ACCESS_KEY)%'
                  secret: '%env(default::S3_SECRET_KEY)%'

    # ---- Phase 03 — embedder HTTP client (Plan 03-02, D-06/D-07) ----
    # Scoped to http://embedder:8000 (SSRF guard T-03-08) + retry on 5xx + transport
    # exceptions for POST. 4xx are NOT retried (D-07).
    embedder.scoping:
        class: Symfony\Component\HttpClient\ScopingHttpClient
        factory: ['Symfony\Component\HttpClient\ScopingHttpClient', 'forBaseUri']
        arguments:
            $client: '@http_client'
            $baseUri: '%transformations.embedder_base_url%'

    embedder.retry_strategy:
        class: Symfony\Component\HttpClient\Retry\GenericRetryStrategy
        arguments:
            $statusCodes:
                0: ['GET', 'HEAD', 'OPTIONS', 'POST']
                423: ['GET', 'HEAD', 'OPTIONS', 'POST']
                425: ['GET', 'HEAD', 'OPTIONS', 'POST']
                429: ['GET', 'HEAD', 'OPTIONS', 'POST']
                500: ['GET', 'HEAD', 'OPTIONS', 'POST']
                502: ['GET', 'HEAD', 'OPTIONS', 'POST']
                503: ['GET', 'HEAD', 'OPTIONS', 'POST']
                504: ['GET', 'HEAD', 'OPTIONS', 'POST']
                507: ['GET', 'HEAD', 'OPTIONS', 'POST']
                510: ['GET', 'HEAD', 'OPTIONS', 'POST']
            $delayMs: 200
            $multiplier: 2.0
            $maxDelayMs: 800
            $jitter: 0.0

    embedder.client:
        class: Symfony\Component\HttpClient\RetryableHttpClient
        arguments:
            $client: '@embedder.scoping'
            $strategy: '@embedder.retry_strategy'
            $maxRetries: 3

    # ---- Phase 03 — Public route lock infrastructure (Plan 03-03, D-01/D-04) ----
    # Native phpredis (\Redis) client wired to the docker-compose `redis` service.
    # Used by symfony/lock RedisStore. We deliberately use a fresh client (not a
    # shared one) — symfony/lock holds short-lived connections and the
    # ConversationService uses Predis on its own URL.
    lock.transformations.redis:
        class: Redis
        calls:
            - connect: ['%env(string:default:transformations.redis_host_default:REDIS_HOST)%', '%env(int:default:transformations.redis_port_default:REDIS_PORT)%']

    lock.transformations.store:
        class: Symfony\Component\Lock\Store\RedisStore
        arguments: ['@lock.transformations.redis']

    lock.transformations.factory:
        class: Symfony\Component\Lock\LockFactory
        arguments: ['@lock.transformations.store']
        public: true

    # Allow autowiring `LockFactory` in PublicTransformationController via service id.
    Symfony\Component\Lock\LockFactory $transformationsLockFactory: '@lock.transformations.factory'

    # ---- Phase 03 — Variant cache + lookup (Plan 03-03) ----
    App\Service\AssetTransformation\VariantCache:
        arguments:
            $storage: '@assets.storage'

    App\Service\AssetTransformation\TransformationLookup: ~

when@test:
    services:
        # W2 (GATING) — keep a REAL RedisStore in test so inter-process
        # contention is genuinely simulable. The `redis` docker-compose
        # service is reachable from the api test container.
        lock.transformations.redis:
            class: Redis
            calls:
                - connect: ['%env(string:default:transformations.redis_host_default:REDIS_HOST)%', '%env(int:default:transformations.redis_port_default:REDIS_PORT)%']

        lock.transformations.store:
            class: Symfony\Component\Lock\Store\RedisStore
            arguments: ['@lock.transformations.redis']

        lock.transformations.factory:
            class: Symfony\Component\Lock\LockFactory
            arguments: ['@lock.transformations.store']
            public: true






